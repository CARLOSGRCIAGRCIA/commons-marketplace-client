name: CI

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        name: Lint & Typecheck
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run linter
              run: npm run lint

            - name: Typecheck
              run: npx tsc --noEmit

    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            # Wiring only for now: this repo has no test runner yet.
            # Adding one (vitest/jest/playwright) via a "test" script in
            # package.json activates this job automatically.
            - name: Check for test script
              id: has_tests
              run: >-
                  echo "present=$(node -p "Boolean(require('./package.json').scripts.test)")"
                  >> "$GITHUB_OUTPUT"

            - name: Run tests
              if: steps.has_tests.outputs.present == 'true'
              run: npm test

            - name: No test suite configured
              if: steps.has_tests.outputs.present != 'true'
              run: >-
                  echo "::warning::No 'test' script in package.json -
                  skipping tests (add vitest/jest/playwright to activate)."

    security:
        name: Security Scan
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            # Advisory-only until the dependency baseline is triaged;
            # flip continue-on-error off to make audits blocking.
            - name: Run npm audit
              run: npm audit --audit-level=high
              continue-on-error: true
