name: CI

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        name: Lint & Typecheck
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run linter
              run: npm run lint

            - name: Typecheck
              run: npx tsc --noEmit

    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            # Wiring only for now: this repo has no test runner yet.
            # Adding one (vitest/jest/playwright) via a "test" script in
            # package.json activates this job automatically.
            - name: Check for test script
              id: has_tests
              run: >-
                  echo "present=$(node -p "Boolean(require('./package.json').scripts.test)")"
                  >> "$GITHUB_OUTPUT"

            - name: Run tests
              if: steps.has_tests.outputs.present == 'true'
              run: npm test

            - name: No test suite configured
              if: steps.has_tests.outputs.present != 'true'
              run: >-
                  echo "::warning::No 'test' script in package.json -
                  skipping tests (add vitest/jest/playwright to activate)."

    security:
        name: Security Scan
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            # Advisory-only until the dependency baseline is triaged;
            # flip continue-on-error off to make audits blocking.
            - name: Run npm audit
              run: npm audit --audit-level=high
              continue-on-error: true

    build:
        name: Build & Push Docker
        runs-on: ubuntu-latest
        needs: [lint, test, security]
        # Only releases to main publish images; PRs and develop stay CI-only.
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4

            - name: Get version
              id: version
              run: >-
                  echo "VERSION=$(node -p "require('./package.json').version")"
                  >> "$GITHUB_OUTPUT"

            - name: Set image name and tags
              id: image
              run: |
                  IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
                  SHORT_SHA="$(git rev-parse --short HEAD)"
                  DATE_TAG="$(date -u +%Y%m%d)"
                  {
                      echo "name=$IMAGE"
                      echo "short_sha=$SHORT_SHA"
                      echo "dated=$DATE_TAG-$SHORT_SHA"
                  } >> "$GITHUB_OUTPUT"

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: true
                  tags: |
                      ${{ steps.image.outputs.name }}:${{ steps.version.outputs.VERSION }}
                      ${{ steps.image.outputs.name }}:${{ steps.image.outputs.short_sha }}
                      ${{ steps.image.outputs.name }}:${{ steps.image.outputs.dated }}
                      ${{ steps.image.outputs.name }}:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
